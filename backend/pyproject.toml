[project]
name = "vibradiag"
version = "0.1.0"
description = "Local-only vibration analysis and evidence-agent prototype"
requires-python = ">=3.11,<3.13"
dependencies = ["fastapi", "uvicorn", "python-multipart", "numpy", "scipy", "langgraph", "httpx", "sqlalchemy==2.1.6", "psycopg[binary]==3.3.6", "alembic==1.20.1", "argon2-cffi==25.1.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vibradiag"]

[dependency-groups]
dev = ["pytest"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
